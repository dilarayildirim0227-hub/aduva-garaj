services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aduva
      POSTGRES_PASSWORD: aduva
      POSTGRES_DB: aduva
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aduva -d aduva"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./python-backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://aduva:aduva@postgres:5432/aduva
      REDIS_URL: redis://redis:6379
      SECRET_KEY: ${SECRET_KEY:-your-super-secret-key-change-in-production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      CART_FREE_SHIPPING_KURUS: 75000
      CART_SHIPPING_FEE_KURUS: 7990
      # S3/MinIO settings (optional - use local storage if not configured)
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: aduva
      S3_ACCESS_KEY: aduva
      S3_SECRET_KEY: aduva12345
      CDN_BASE_URL: http://localhost:9000/aduva
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # minio:
      #   condition: service_started

  frontend:
    build:
      context: ./node-frontend
      dockerfile: Dockerfile
    environment:
      PORT: 3001
      API_URL: http://api:4000
    ports:
      - "3001:3001"
    depends_on:
      - api

  # minio:
  #   image: minio/minio:latest
  #   command: server /data --console-address ":9001"
  #   environment:
  #     MINIO_ROOT_USER: aduva
  #     MINIO_ROOT_PASSWORD: aduva12345
  #   ports:
  #     - "9000:9000"
  #     - "9001:9001"
  #   volumes:
  #     - miniodata:/data

volumes:
  pgdata:

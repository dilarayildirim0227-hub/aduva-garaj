services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aduva
      POSTGRES_PASSWORD: aduva
      POSTGRES_DB: aduva
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aduva -d aduva"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: node:20-alpine
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      NODE_ENV: development
      API_PORT: 4000
      DATABASE_URL: postgresql://aduva:aduva@postgres:5432/aduva?schema=public
      REDIS_URL: redis://redis:6379
      CART_FREE_SHIPPING_KURUS: 75000
      CART_SHIPPING_FEE_KURUS: 7990
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "corepack enable && pnpm --filter @aduva/api prisma:deploy && pnpm --filter @aduva/api prisma:seed && pnpm --filter @aduva/api dev"

  web:
    image: node:20-alpine
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    ports:
      - "3000:3000"
    depends_on:
      - api
    command: sh -c "corepack enable && pnpm --filter @aduva/web dev"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aduva
      MINIO_ROOT_PASSWORD: aduva12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
